# Configuration for tools/style_gate.py -- see code-style.md.
# Nothing here changes the rules; it says which files in THIS tree they
# apply to, and how small the file list may get before a pass is a lie.

# Migration only: the columns a level occupied before a tree was
# converted. This tree was written tab-indented from its first commit, so
# nothing here was ever converted and the value is never read. It is set
# because the key documents that the question was considered.
indent_width = 4

# Below this the gate fails instead of passing. Deliberately under the
# real count, which is around forty-five: this catches a file list that
# has collapsed -- a broken include/exclude, a discovery path that
# matched nothing -- and it does not police a number, so adding a source
# file never requires touching it.
#
# The distinction matters because "found nothing" and "found nothing
# wrong" are the same green output otherwise.
#
# It was 8 while the tree had thirteen files and stayed there while the
# tree grew to forty-five, which is how a floor stops being one: a
# collapse to a quarter of the tree would have passed. Raised, and worth
# raising again the next time this number is a small fraction of `list`.
floor = 30

# `Makefile` is deliberately NOT named here, and this is a real decision
# rather than an omission.
#
# Naming it would apply the tab rule to it. A recipe line must begin with
# a literal tab, so that much is compliant by construction -- but the body
# of an `ifdef` is indented with SPACES, because a leading tab there is
# read as a recipe line instead. This Makefile has `ifdef DEBUG` and
# `ifdef SANITIZE` blocks, so both spellings are correct and required in
# the same file, and the tab rule has nothing true to say about it.
#
# apt-emerge names its Makefile and is right to: it has no `ifeq`, so the
# rule costs it nothing and buys the text checks. The moment it gains one,
# its answer changes to this one. The cost here is that the Makefile gets
# no trailing-whitespace or final-newline check either; that is the trade,
# and it is the right way round.
indent_names = []

# `exclude` REPLACES the shipped defaults rather than extending them --
# `cfg.update(loaded)`, so naming one directory here would drop the other
# eight. That is why the whole list is restated, against this file's own
# earlier advice not to: the advice assumed adding nothing.
#
# What needed adding is `build-android` and `build-tests`. Both hold
# generated sources, both are covered by `.gitignore`, and neither is in
# the shipped defaults -- so the git discovery path skipped them while a
# plain walk would not, which is precisely the disagreement between the
# two paths that the tool's own comment warns about. A CI checkout
# without `.git` that had been built would have gated moc output.
exclude = ["attic", "third_party", "vendor", "build", "target",
           "dist", ".pytest_cache", ".claude",
           "build-android", "build-tests"]

# ASCII outside string literals, which is the rule in code-style.md and is
# free here: the gate reads C and C++ with a scanner rather than checking
# raw bytes, so a glyph this program prints stays legal inside a literal
# while an em dash in a comment does not. Measured before turning it on --
# this tree had zero non-ASCII characters to fix, in any file the gate
# reads. It costs nothing today and stops the drift that made hydra's
# comments accumulate 858 of them.
ascii_only = true
