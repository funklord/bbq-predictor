; The server package booted under openrc, in a hull vm whose PID 1 is the
; image's own init (project.md sec 15.12.5). Run by `make check-boot`,
; which bakes the image first with test/boot/bake.sh.
(machine
  (source "bbq-boot-openrc")
  (mutable overlay)
  (backend vm)
  ; openrc-init, not /sbin/init: the image has sysvinit too, and booting it
  ; leaves OpenRC installed and not booted, refusing to manage a service.
  (init "/sbin/openrc-init")
  (memory "1G")
  (cpus 2)
  (volumes
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "bash" "/payload/payload.sh"))
