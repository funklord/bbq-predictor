; The server package booted under sysvinit, in a hull vm whose PID 1 is the
; image's own init (project.md sec 15.12.5). Run by `make check-boot`,
; which bakes the image first with test/boot/bake.sh.
(machine
  (source "bbq-boot-sysvinit")
  (mutable overlay)
  (backend vm)
  (init "/sbin/init")
  (memory "1G")
  (cpus 2)
  (volumes
    (volume (host ".") (guest "/payload") (mode ro)))
  (command "bash" "/payload/payload.sh"))
