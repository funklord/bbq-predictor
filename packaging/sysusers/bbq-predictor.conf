# The account the fetch timer runs as (project.md sec 16.15).
#
# A fixed system user rather than DynamicUser, chosen deliberately: the
# archive IS the product here, and DynamicUser puts StateDirectory under
# /var/lib/private, which systemd keeps at 0700 so a recycled dynamic uid
# cannot reach it. That made the archive root-only, and an archive the
# machine's owner cannot read is one they will not read.
#
# The home directory is the state directory, so the account has somewhere
# of its own and no shell to reach it with.
#
#Type Name          ID Gecos                        Home                   Shell
u     bbq-predictor -  "bbq-predictor fetch timer"  /var/lib/bbq-predictor -
